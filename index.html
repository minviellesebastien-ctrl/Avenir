<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    document.documentElement.classList.add("app-boot");
    try {
      if (localStorage.getItem("avenir-mode-confidentiel-v1") === "true") {
        document.documentElement.classList.add("privacy-boot");
      }
      if (localStorage.getItem("avenir-pin-enabled-v1") === "true" &&
          localStorage.getItem("avenir-pin-hash-v1")) {
        document.documentElement.classList.add("pin-boot");
      }
    } catch (error) {}
  </script>
  <style>
    html.app-boot .app-shell { visibility: hidden !important; }
    html.pin-boot body { background: #ff4b0b; }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4b0b">
  <meta name="description" content="Vue d’ensemble du patrimoine">
  <meta name="app-version" content="13.9.6">

  <title>AV€NIR - Patrimoine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon4-192.png">
  <link rel="apple-touch-icon" href="./icon4-192.png">
  <link rel="stylesheet" href="./style.css?v=13.9.6-demarrage-direct">
</head>

<body>
  <main class="app-shell">
    <section class="dashboard">

      <article class="total-card">
        <p class="total-label">
          TOTAL PATRIMOINE
          <span id="patrimoineEvolution" class="total-evolution"></span>
        </p>
        <div id="totalAmount" class="total-amount">0,00 €</div>

        <button
          id="privacyToggleButton"
          class="privacy-toggle-button"
          type="button"
          aria-label="Masquer les montants"
          aria-pressed="false"
          title="Masquer les montants"
        >
          <svg class="privacy-eye privacy-eye-open" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>

          <svg class="privacy-eye privacy-eye-closed" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.5 10.677A2.5 2.5 0 0 0 13.323 13.5"></path>
            <path d="M7.362 7.561C5.68 8.74 4.279 10.272 2.5 12c1.608 1.623 3.42 3.23 5.5 4.305C10.08 17.38 12.04 18 14 18c1.6 0 3.12-.416 4.5-1.125"></path>
            <path d="M9.88 4.2C11.23 4.066 12.62 4 14 4c4 0 7.39 1.5 10 5-.694 1.05-1.528 2.083-2.5 3"></path>
          </svg>
        </button>
      </article>

      <div class="brand-strip">
        <img class="brand-logo" src="./logo.png" alt="AV€NIR Logo">
        <div class="brand-copy">
          <h1>AV€NIR</h1>
          <p>Dernière mise à jour : <span id="lastUpdated">-</span></p>
        </div>
        <button id="openSettingsButton" class="settings-button" type="button" aria-label="Paramètres">
          <span class="settings-icon">⚙️</span>
        </button>
      </div>

      <div id="accountsList" class="accounts-list"></div>

      <footer class="footer">
        <span class="footer-lock">🔒</span> Données stockées localement
      </footer>

    </section>
  </main>

  <div id="settingsOverlay" class="settings-overlay" hidden>
    <div class="settings-panel">
      <div class="sheet-handle"></div>
      <div class="settings-header">
        <div>
          <p class="settings-eyebrow">PARAMÈTRES</p>
          <h2>Gérer les comptes</h2>
        </div>
        <button id="closeSettingsButton" class="close-settings-button" type="button" aria-label="Fermer">&times;</button>
      </div>

      <div id="settingsAccounts" class="settings-accounts"></div>

      <div class="settings-actions">
        <button id="addAccountButton" class="add-account-button" type="button">+ Ajouter un compte</button>
        <button id="saveSettingsButton" class="save-settings-button" type="button">Enregistrer</button>
      </div>
    </div>
  </div>

  <template id="accountCardTemplate">
    <div class="account-card">
      <div class="account-icon-wrap">
        <img class="account-icon" src="" alt="">
      </div>
      <div class="account-main">
        <div class="account-name"></div>
      </div>
      <div class="account-value">
        <span class="account-amount">0,00</span>
        <span class="currency">€</span>
      </div>
    </div>
  </template>

  <template id="settingsAccountTemplate">
    <div class="settings-account-row">
      <button class="drag-handle" type="button" aria-label="Réordonner">⋮⋮</button>
      <div class="settings-field">
        <label>Nom du compte</label>
        <input class="name-input" type="text" placeholder="Ex : Compte Courant">
      </div>
      <div class="settings-field amount-field">
        <label>Montant (€)</label>
        <div class="amount-input-wrapper">
          <input class="amount-input" type="text" inputmode="decimal" placeholder="0,00">
          <span>€</span>
        </div>
      </div>
      <button class="delete-account-button" type="button">Supprimer</button>
    </div>
  </template>

  <script src="./script.js?v=13.9.6"></script>
</body>
</html>
